<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900">
  <defs>
    <linearGradient id="room1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DFD0"/>
      <stop offset="60%" stop-color="#D4C4AE"/>
      <stop offset="100%" stop-color="#BFB09A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#room1)"/>
  <!-- Floor -->
  <rect x="0" y="620" width="720" height="280" fill="#C4A87A" opacity="0.4"/>
  <!-- Wall line -->
  <line x1="0" y1="620" x2="720" y2="620" stroke="#B8A080" stroke-width="1" opacity="0.5"/>
  <!-- Table in room -->
  <rect x="180" y="380" width="360" height="14" rx="3" fill="#7A5C3A" opacity="0.5"/>
  <rect x="200" y="394" width="12" height="200" rx="3" fill="#7A5C3A" opacity="0.4"/>
  <rect x="508" y="394" width="12" height="200" rx="3" fill="#7A5C3A" opacity="0.4"/>
  <!-- Shadow -->
  <ellipse cx="360" cy="594" rx="150" ry="12" fill="#1A1714" opacity="0.08"/>
  <!-- Window light -->
  <rect x="520" y="100" width="140" height="220" rx="4" fill="#F0E8D0" opacity="0.6"/>
  <line x1="590" y1="100" x2="590" y2="320" stroke="#D4C4AE" stroke-width="1" opacity="0.5"/>
  <line x1="520" y1="210" x2="660" y2="210" stroke="#D4C4AE" stroke-width="1" opacity="0.5"/>
</svg>
